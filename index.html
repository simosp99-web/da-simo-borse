<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>DA SIMO — Listino</title>
<style>
  /* =========================================================
     DESIGN TOKENS
     ========================================================= */
  :root {
    --bg:           #ece4d6;       /* warm beige */
    --paper:        #fdfaf4;       /* cream paper */
    --paper-soft:   #f6efe1;
    --ink:          #2a241d;
    --ink-soft:     #5a4f42;
    --line:         #c9bda6;
    --line-soft:    #ddd1ba;
    --accent:       #6b4f3a;       /* leather brown */
    --accent-dark:  #4a3525;
    --danger:       #a93a3a;
    --success:      #4a6b3a;
    --shadow-sm:    0 2px 6px rgba(60, 40, 20, 0.06);
    --shadow-md:    0 6px 20px rgba(60, 40, 20, 0.10);
    --radius:       10px;
    --radius-sm:    6px;
  }

  /* =========================================================
     BASE / RESET
     ========================================================= */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Didot", "Bodoni 72", "Bodoni MT", "Playfair Display", Georgia, "Times New Roman", serif;
    color: var(--ink);
    background: var(--bg);
    -webkit-text-size-adjust: 100%;
    line-height: 1.5;
  }
  button, input, select { font-family: inherit; }

  /* =========================================================
     PAGE WRAPPER
     ========================================================= */
  .page {
    max-width: 880px;
    margin: 28px auto;
    background: var(--paper);
    padding: 40px 48px 32px;
    box-shadow: var(--shadow-md);
    border-radius: var(--radius);
  }

  /* =========================================================
     TOP BAR
     ========================================================= */
  .topbar {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .topbar .who { font-style: italic; }
  .link-btn {
    background: none;
    border: none;
    color: var(--accent-dark);
    text-decoration: underline;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    padding: 4px 6px;
  }
  .link-btn:hover { color: var(--accent); }

  /* =========================================================
     HEADER
     ========================================================= */
  .header { text-align: center; margin-bottom: 28px; }
  .header h1 {
    margin: 0;
    font-size: 50px;
    letter-spacing: 9px;
    font-weight: 400;
  }
  .header .subtitle {
    margin-top: 4px;
    font-size: 16px;
    font-style: italic;
    letter-spacing: 1px;
    color: var(--ink-soft);
  }
  .ornament {
    margin: 14px auto 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--ink);
  }
  .ornament .line { flex: 0 1 180px; height: 1px; background: var(--ink); }
  .ornament .glyph {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 18px;
    letter-spacing: 4px;
    line-height: 1;
    transform: translateY(-1px);
  }

  /* =========================================================
     STATUS MESSAGES (toast-like)
     ========================================================= */
  .status {
    text-align: center;
    padding: 12px 16px;
    margin: 12px 0;
    border-radius: var(--radius-sm);
    font-size: 14px;
    display: none;
    box-shadow: var(--shadow-sm);
  }
  .status.show { display: block; }
  .status.info  { background: var(--paper-soft); color: var(--ink); border: 1px solid var(--line-soft); }
  .status.error { background: #f7e3e3; color: #6e1f1f; border: 1px solid #e0b8b8; }
  .status.ok    { background: #e3efdc; color: #2c4a1d; border: 1px solid #b8d8b8; }

  /* =========================================================
     PANELS (login / editor / search)
     ========================================================= */
  .panel {
    background: var(--paper-soft);
    border: 1px solid var(--line-soft);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 24px;
    box-shadow: var(--shadow-sm);
  }
  .panel h2 {
    margin: 0 0 16px 0;
    font-size: 16px;
    color: var(--ink);
    letter-spacing: 3px;
    font-weight: 400;
    text-transform: uppercase;
    text-align: center;
  }
  .login { max-width: 420px; margin-left: auto; margin-right: auto; }

  /* Form fields */
  .field { display: flex; flex-direction: column; margin-bottom: 14px; }
  .field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  @media (max-width: 540px) {
    .field-row { grid-template-columns: 1fr; }
  }
  .field label {
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 6px;
    letter-spacing: 0.5px;
  }
  .field input[type="text"],
  .field input[type="email"],
  .field input[type="password"],
  .field input[type="number"],
  .field select {
    width: 100%;
    padding: 13px 12px;
    font-size: 16px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: #fff;
    font-family: Georgia, "Times New Roman", serif;
    color: var(--ink);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .field input:focus,
  .field select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(107, 79, 58, 0.15);
  }
  .field input[type="file"] { font-size: 15px; padding: 10px 0; }
  .field-check {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
  }
  .field-check input[type="checkbox"] {
    width: 20px;
    height: 20px;
    accent-color: var(--accent);
  }
  .field-check label {
    margin: 0;
    font-size: 15px;
    color: var(--ink);
  }

  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
  .btn {
    flex: 1 1 140px;
    padding: 13px 18px;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 400;
    border-radius: var(--radius-sm);
    border: 1px solid var(--accent-dark);
    background: var(--accent-dark);
    color: var(--paper);
    cursor: pointer;
    min-height: 46px;
    font-family: inherit;
    transition: background 0.15s, transform 0.05s;
  }
  .btn:hover:not(:disabled) { background: var(--accent); }
  .btn.secondary {
    background: transparent;
    color: var(--accent-dark);
  }
  .btn.secondary:hover:not(:disabled) { background: rgba(107, 79, 58, 0.08); }
  .btn.danger {
    background: transparent;
    color: var(--danger);
    border-color: var(--danger);
  }
  .btn.danger:hover:not(:disabled) { background: rgba(169, 58, 58, 0.08); }
  .btn:disabled { opacity: 0.5; cursor: wait; }
  .btn:active:not(:disabled) { transform: translateY(1px); }

  .preview { margin-top: 8px; font-size: 13px; color: var(--ink-soft); }
  .preview img {
    margin-top: 6px;
    max-height: 80px;
    max-width: 100%;
    object-fit: contain;
    border: 1px solid var(--line-soft);
    border-radius: var(--radius-sm);
    background: #fff;
    padding: 4px;
  }
  .preview .hint {
    display: block;
    margin-top: 4px;
    font-style: italic;
    font-size: 12px;
  }

  /* =========================================================
     SEARCH + FILTERS
     ========================================================= */
  .toolbar {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 24px;
  }
  .search {
    position: relative;
  }
  .search input {
    width: 100%;
    padding: 14px 16px 14px 44px;
    font-size: 16px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: #fff;
    font-family: Georgia, "Times New Roman", serif;
    color: var(--ink);
  }
  .search input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(107, 79, 58, 0.15);
  }
  .search::before {
    content: "";
    position: absolute;
    left: 16px;
    top: 50%;
    width: 16px;
    height: 16px;
    transform: translateY(-50%);
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235a4f42' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='11' cy='11' r='8'/><line x1='21' y1='21' x2='16.65' y2='16.65'/></svg>");
    background-repeat: no-repeat;
    background-size: contain;
    pointer-events: none;
  }
  .filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .chip {
    padding: 8px 16px;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink-soft);
    border-radius: 999px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent-dark); }
  .chip.active {
    background: var(--accent-dark);
    color: var(--paper);
    border-color: var(--accent-dark);
  }

  /* =========================================================
     CATALOG TABLE
     ========================================================= */
  .catalog { width: 100%; }
  table.catalog-table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }
  table.catalog-table thead th {
    text-align: left;
    font-size: 14px;
    color: var(--ink);
    border-bottom: 1px solid var(--ink);
    padding: 10px 8px 12px;
    font-weight: 400;
    letter-spacing: 0.5px;
  }
  table.catalog-table th.col-foto,
  table.catalog-table td.col-foto   { text-align: center; width: 130px; }
  table.catalog-table th.col-costo,
  table.catalog-table td.col-costo  { text-align: center; width: 80px; color: var(--ink-soft); }
  table.catalog-table th.col-prezzo,
  table.catalog-table td.col-prezzo { text-align: right; width: 130px; }
  table.catalog-table th.col-actions,
  table.catalog-table td.col-actions { width: 90px; text-align: center; }

  table.catalog-table tbody td {
    padding: 18px 8px;
    border-bottom: 1px solid var(--line);
    vertical-align: middle;
    font-size: 16px;
  }
  table.catalog-table tbody td.col-descr { word-break: break-word; line-height: 1.4; }
  table.catalog-table tbody td.col-prezzo { white-space: nowrap; }
  table.catalog-table tbody td.col-foto img {
    max-height: 90px;
    max-width: 110px;
    object-fit: contain;
    display: inline-block;
    border-radius: 4px;
  }

  /* Sub-info under product name (color, category, badges) */
  .descr-name { font-size: 16px; }
  .descr-meta {
    margin-top: 4px;
    font-size: 12px;
    font-style: italic;
    color: var(--ink-soft);
    letter-spacing: 0.3px;
  }
  .descr-meta .sep { margin: 0 6px; opacity: 0.6; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-style: normal;
    margin-top: 6px;
  }
  .badge-na {
    background: #f7e3e3;
    color: #6e1f1f;
    border: 1px solid #e0b8b8;
  }
  .row-na td.col-descr,
  .row-na td.col-prezzo {
    opacity: 0.7;
  }
  .row-na td.col-foto img {
    filter: grayscale(0.4);
    opacity: 0.85;
  }

  /* Admin row-buttons */
  .row-actions {
    display: inline-flex;
    flex-direction: column;
    gap: 6px;
    align-items: stretch;
  }
  .icon-btn {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink-soft);
    padding: 6px 10px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 0.5px;
    transition: all 0.15s;
  }
  .icon-btn.edit:hover { color: var(--accent-dark); border-color: var(--accent-dark); }
  .icon-btn.del { color: var(--danger); border-color: var(--danger); }
  .icon-btn.del:hover { background: rgba(169, 58, 58, 0.08); }

  .empty-msg {
    text-align: center;
    color: var(--ink-soft);
    padding: 32px 8px;
    font-style: italic;
    font-size: 15px;
  }

  /* =========================================================
     EDIT MODE BANNER
     ========================================================= */
  .edit-banner {
    background: var(--accent-dark);
    color: var(--paper);
    padding: 8px 14px;
    border-radius: var(--radius-sm) var(--radius-sm) 0 0;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    display: none;
    text-align: center;
    margin-bottom: -1px;
  }
  .edit-banner.show { display: block; }

  /* =========================================================
     FOOTER (only in print)
     ========================================================= */
  .footer {
    display: none;
    text-align: center;
    margin-top: 28px;
    font-size: 13px;
    color: var(--ink);
    font-style: italic;
  }

  /* =========================================================
     RESPONSIVE — iPhone (card-row)
     ========================================================= */
  @media (max-width: 600px) {
    .page { margin: 0; padding: 24px 18px; box-shadow: none; border-radius: 0; }
    .header h1 { font-size: 36px; letter-spacing: 6px; }
    .header .subtitle { font-size: 14px; }
    .ornament .line { flex-basis: 90px; }

    table.catalog-table thead { display: none; }
    table.catalog-table,
    table.catalog-table tbody,
    table.catalog-table tr,
    table.catalog-table td { display: block; width: 100%; }

    table.catalog-table tr {
      display: grid;
      grid-template-columns: 1fr 110px;
      grid-template-areas:
        "descr  foto"
        "prezzo foto"
        "costo  foto"
        "act    act";
      gap: 4px 14px;
      padding: 16px 0;
      border-bottom: 1px solid var(--line);
      align-items: center;
    }
    table.catalog-table td { border: none; padding: 0; }
    table.catalog-table td.col-descr   { grid-area: descr; font-size: 17px; }
    table.catalog-table td.col-foto    { grid-area: foto;  text-align: center; }
    table.catalog-table td.col-costo   { grid-area: costo; font-size: 13px; color: var(--ink-soft); text-align: left; font-style: italic; }
    table.catalog-table td.col-costo::before  { content: "Costo: "; }
    table.catalog-table td.col-prezzo  { grid-area: prezzo; text-align: left; font-size: 17px; }
    table.catalog-table td.col-prezzo::before { content: "Prezzo: "; font-style: italic; color: var(--ink-soft); font-size: 13px; }
    table.catalog-table td.col-actions { grid-area: act; text-align: left; padding-top: 8px; }
    table.catalog-table td.col-foto img { max-height: 95px; max-width: 105px; }
    .row-actions { flex-direction: row; }
    .row-actions .icon-btn { flex: 1; }
  }

  /* =========================================================
     PRINT — A4
     ========================================================= */
  @media print {
    @page { size: A4; margin: 14mm 16mm; }
    body { background: #fff; }
    .page {
      box-shadow: none;
      margin: 0;
      padding: 0;
      max-width: 100%;
      background: #fff;
      border-radius: 0;
    }
    .topbar, .login, .panel.editor, .status, .toolbar, .edit-banner, #publicActions { display: none !important; }
    .footer { display: block; }
    .col-actions { display: none !important; }

    table.catalog-table,
    table.catalog-table thead,
    table.catalog-table tbody,
    table.catalog-table tr,
    table.catalog-table th,
    table.catalog-table td { display: revert; }
    table.catalog-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    table.catalog-table thead { display: table-header-group; }
    table.catalog-table tbody { display: table-row-group; }
    table.catalog-table tr    { display: table-row; }
    table.catalog-table th,
    table.catalog-table td    { display: table-cell; }

    table.catalog-table td.col-costo::before,
    table.catalog-table td.col-prezzo::before { content: none; }

    table.catalog-table thead th {
      border-bottom: 1px solid #000;
      color: #000;
      padding: 8px;
      font-size: 11pt;
      font-weight: 400;
    }
    table.catalog-table th.col-foto,
    table.catalog-table td.col-foto   { text-align: center; width: 28%; }
    table.catalog-table th.col-costo,
    table.catalog-table td.col-costo  { text-align: center; width: 16%; color: #333; }
    table.catalog-table th.col-prezzo,
    table.catalog-table td.col-prezzo { text-align: right; width: 22%; }

    table.catalog-table tbody td {
      border-bottom: 1px solid #888;
      padding: 14px 8px;
      font-size: 11pt;
      vertical-align: middle;
    }
    table.catalog-table tbody td.col-foto img {
      max-height: 85px;
      max-width: 100%;
      object-fit: contain;
    }
    .descr-meta { font-size: 9pt; }
    .badge { border: 1px solid #888; padding: 1px 6px; font-size: 8pt; }

    .header h1 { font-size: 32pt; letter-spacing: 8px; }
    .header .subtitle { font-size: 12pt; font-style: italic; }
    .ornament .line { background: #000; }

    tr, td { page-break-inside: avoid; }
  }
</style>
</head>
<body>

<div class="page">

  <!-- ===== TOP BAR ===== -->
  <div class="topbar" id="topbar">
    <span class="who" id="whoLabel"></span>
    <button class="link-btn" id="loginToggleBtn" type="button">Accedi</button>
    <button class="link-btn" id="logoutBtn" type="button" style="display:none;">Esci</button>
  </div>

  <!-- ===== HEADER ===== -->
  <header class="header">
    <h1 id="shopTitle">DA SIMO</h1>
    <div class="subtitle" id="shopSubtitle">borse e accessori in pelle</div>
    <div class="ornament" aria-hidden="true">
      <span class="line"></span>
      <span class="glyph">&#10086;</span>
      <span class="line"></span>
    </div>
  </header>

  <!-- ===== STATUS MESSAGES ===== -->
  <div class="status" id="statusBox" role="status" aria-live="polite"></div>

  <!-- ===== LOGIN PANEL ===== -->
  <section class="panel login" id="loginPanel" style="display:none;" aria-label="Accesso amministratore">
    <h2>Accesso</h2>
    <div class="field">
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" autocomplete="email" />
    </div>
    <div class="field">
      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" autocomplete="current-password" />
    </div>
    <div class="actions">
      <button class="btn" id="loginBtn" type="button">Entra</button>
      <button class="btn secondary" id="loginCancelBtn" type="button">Annulla</button>
    </div>
  </section>

  <!-- ===== EDITOR ===== -->
  <div class="edit-banner" id="editBanner">Modalità modifica</div>
  <section class="panel editor" id="editorPanel" style="display:none;" aria-label="Aggiungi prodotto">
    <h2 id="editorTitle">Aggiungi prodotto</h2>

    <div class="field">
      <label for="pName">Nome prodotto</label>
      <input type="text" id="pName" placeholder="Es. Borsa Barbara" autocomplete="off" />
    </div>

    <div class="field-row">
      <div class="field">
        <label for="pCategory">Categoria</label>
        <select id="pCategory">
          <option value="Borse">Borse</option>
          <option value="Clutch">Clutch</option>
          <option value="Beauty">Beauty</option>
          <option value="Accessori">Accessori</option>
        </select>
      </div>
      <div class="field">
        <label for="pColor">Colore</label>
        <input type="text" id="pColor" placeholder="Es. cuoio, nero, panna" autocomplete="off" />
      </div>
    </div>

    <div class="field">
      <label for="pPrice">Prezzo di vendita (EUR)</label>
      <input type="number" id="pPrice" inputmode="decimal" step="0.01" min="0" placeholder="Es. 89,00" />
    </div>

    <div class="field">
      <label for="pPhoto">Foto prodotto</label>
      <input type="file" id="pPhoto" accept="image/*" capture="environment" />
      <div class="preview" id="preview"></div>
    </div>

    <div class="field-check">
      <input type="checkbox" id="pAvailable" checked />
      <label for="pAvailable">Disponibile</label>
    </div>

    <div class="actions">
      <button class="btn" id="addBtn" type="button">Aggiungi</button>
      <button class="btn secondary" id="cancelEditBtn" type="button" style="display:none;">Annulla modifica</button>
      <button class="btn secondary" id="printBtn" type="button">Stampa</button>
    </div>
  </section>

  <!-- ===== PUBLIC PRINT BUTTON ===== -->
  <div class="actions" id="publicActions" style="margin-bottom:24px;">
    <button class="btn secondary" id="printBtnPublic" type="button">Stampa listino</button>
  </div>

  <!-- ===== TOOLBAR: SEARCH + FILTERS ===== -->
  <div class="toolbar">
    <div class="search">
      <input type="text" id="searchInput" placeholder="Cerca un prodotto…" autocomplete="off" />
    </div>
    <div class="filters" id="filters" role="tablist">
      <button class="chip active" data-cat="Tutti" type="button">Tutti</button>
      <button class="chip" data-cat="Borse" type="button">Borse</button>
      <button class="chip" data-cat="Clutch" type="button">Clutch</button>
      <button class="chip" data-cat="Beauty" type="button">Beauty</button>
      <button class="chip" data-cat="Accessori" type="button">Accessori</button>
    </div>
  </div>

  <!-- ===== CATALOG ===== -->
  <section class="catalog">
    <table class="catalog-table" id="catalogTable">
      <thead>
        <tr>
          <th class="col-descr">Descrizione</th>
          <th class="col-foto">FOTO</th>
          <th class="col-costo">Costo</th>
          <th class="col-prezzo">Prezzo vendita</th>
          <th class="col-actions" aria-label="Azioni"></th>
        </tr>
      </thead>
      <tbody id="catalogBody"></tbody>
    </table>
    <div class="empty-msg" id="emptyMsg">Caricamento in corso…</div>
  </section>

  <!-- ===== FOOTER (print only) ===== -->
  <footer class="footer">Pagina 1 di 1</footer>

</div>

<!-- ===========================================================
     SUPABASE CLIENT (CDN)
     =========================================================== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* ===========================================================
   ⚙️ CONFIGURAZIONE
   =========================================================== */
const SUPABASE_URL      = "https://nsnbunoarkoxjksspxau.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5zbmJ1bm9hcmtveGprc3NweGF1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5OTA4MzUsImV4cCI6MjA5MzU2NjgzNX0.gtyPDZCVlzew3gD_X8uEKN9G7DhHMZK4AQuXmrpoR1o";
const BUCKET_NAME       = "product-images";
const SHOP_TITLE        = "DA SIMO";
const SHOP_SUBTITLE     = "borse e accessori in pelle";
const CATEGORIES        = ["Borse", "Clutch", "Beauty", "Accessori"];
const DEFAULT_CATEGORY  = "Borse";

document.getElementById("shopTitle").textContent    = SHOP_TITLE;
document.getElementById("shopSubtitle").textContent = SHOP_SUBTITLE;
document.title = SHOP_TITLE + " — Listino";

/* ===========================================================
   INIT SUPABASE
   =========================================================== */
const { createClient } = window.supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ===========================================================
   STATE
   =========================================================== */
let products        = [];
let currentUser     = null;
let pendingImageFile = null;
let editingId       = null;     // id of product being edited (null = add mode)
let activeCategory  = "Tutti";
let searchQuery     = "";

/* ===========================================================
   UTILITIES
   =========================================================== */
function formatEUR(n) {
  const num = typeof n === "number" ? n : parseFloat(n);
  if (isNaN(num)) return "—";
  return num.toFixed(2).replace(".", ",") + " €";
}

function showStatus(message, type) {
  const box = document.getElementById("statusBox");
  box.textContent = message;
  box.className = "status show " + (type || "info");
  if (type === "ok" || type === "info") {
    setTimeout(() => { box.className = "status"; }, 3500);
  }
}
function clearStatus() {
  document.getElementById("statusBox").className = "status";
}

/* Backward-compatible field access (handles missing values) */
function getCategory(p)  { return (p && p.category) ? p.category : ""; }
function getColor(p)     { return (p && p.color)    ? p.color    : ""; }
function isAvailable(p)  {
  // If field is missing/null, treat as available (backward compatibility)
  if (!p || p.available === undefined || p.available === null) return true;
  return p.available !== false;
}

/* ===========================================================
   AUTH
   =========================================================== */
const loginPanel     = document.getElementById("loginPanel");
const editorPanel    = document.getElementById("editorPanel");
const loginToggleBtn = document.getElementById("loginToggleBtn");
const logoutBtn      = document.getElementById("logoutBtn");
const whoLabel       = document.getElementById("whoLabel");
const loginEmail     = document.getElementById("loginEmail");
const loginPassword  = document.getElementById("loginPassword");
const loginBtn       = document.getElementById("loginBtn");
const loginCancelBtn = document.getElementById("loginCancelBtn");

function updateAuthUI() {
  if (currentUser) {
    whoLabel.textContent = currentUser.email;
    loginToggleBtn.style.display = "none";
    logoutBtn.style.display = "inline-block";
    loginPanel.style.display = "none";
    editorPanel.style.display = "block";
  } else {
    whoLabel.textContent = "";
    loginToggleBtn.style.display = "inline-block";
    logoutBtn.style.display = "none";
    editorPanel.style.display = "none";
    exitEditMode(); // ensure no leftover edit state
  }
  render();
}

loginToggleBtn.addEventListener("click", () => {
  loginPanel.style.display = "block";
  loginEmail.focus();
});
loginCancelBtn.addEventListener("click", () => {
  loginPanel.style.display = "none";
  loginEmail.value = "";
  loginPassword.value = "";
  clearStatus();
});

loginBtn.addEventListener("click", async () => {
  const email = loginEmail.value.trim();
  const password = loginPassword.value;
  if (!email || !password) {
    showStatus("Inserisci email e password.", "error");
    return;
  }
  loginBtn.disabled = true;
  showStatus("Accesso in corso…", "info");
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  loginBtn.disabled = false;
  if (error) {
    showStatus("Accesso fallito: " + error.message, "error");
    return;
  }
  currentUser = data.user;
  loginEmail.value = "";
  loginPassword.value = "";
  showStatus("Benvenuto!", "ok");
  updateAuthUI();
});

logoutBtn.addEventListener("click", async () => {
  await sb.auth.signOut();
  currentUser = null;
  showStatus("Sei uscito.", "info");
  updateAuthUI();
});

sb.auth.onAuthStateChange((_event, session) => {
  currentUser = session ? session.user : null;
  updateAuthUI();
});

/* ===========================================================
   LOAD PRODUCTS
   =========================================================== */
async function loadProducts() {
  document.getElementById("emptyMsg").textContent = "Caricamento in corso…";
  document.getElementById("emptyMsg").style.display = "block";

  const { data, error } = await sb
    .from("products")
    .select("*")
    .order("created_at", { ascending: true });

  if (error) {
    showStatus("Errore caricamento prodotti: " + error.message, "error");
    products = [];
    render();
    return;
  }
  products = data || [];
  render();
}

/* ===========================================================
   RENDER (with search + category filter)
   =========================================================== */
const tbody    = document.getElementById("catalogBody");
const emptyMsg = document.getElementById("emptyMsg");

function getFiltered() {
  const q = searchQuery.trim().toLowerCase();
  return products.filter(p => {
    /* Category filter */
    if (activeCategory !== "Tutti") {
      const cat = getCategory(p);
      if (cat !== activeCategory) return false;
    }
    /* Search filter */
    if (q) {
      const name = (p.name || "").toLowerCase();
      const color = getColor(p).toLowerCase();
      if (!name.includes(q) && !color.includes(q)) return false;
    }
    return true;
  });
}

function render() {
  tbody.innerHTML = "";
  const list = getFiltered();

  if (products.length === 0) {
    emptyMsg.textContent = "Nessun prodotto ancora aggiunto.";
    emptyMsg.style.display = "block";
    return;
  }
  if (list.length === 0) {
    emptyMsg.textContent = "Nessun prodotto trovato con i filtri attuali.";
    emptyMsg.style.display = "block";
    return;
  }
  emptyMsg.style.display = "none";

  list.forEach(p => {
    const tr = document.createElement("tr");
    tr.dataset.id = p.id;
    const available = isAvailable(p);
    if (!available) tr.classList.add("row-na");

    /* Description column with name + meta + badge */
    const tdName = document.createElement("td");
    tdName.className = "col-descr";

    const nameDiv = document.createElement("div");
    nameDiv.className = "descr-name";
    nameDiv.textContent = p.name || "(senza nome)";
    tdName.appendChild(nameDiv);

    const metaParts = [];
    const cat = getCategory(p);
    const col = getColor(p);
    if (cat) metaParts.push(cat);
    if (col) metaParts.push(col);
    if (metaParts.length) {
      const metaDiv = document.createElement("div");
      metaDiv.className = "descr-meta";
      metaParts.forEach((m, i) => {
        if (i > 0) {
          const sep = document.createElement("span");
          sep.className = "sep";
          sep.textContent = "·";
          metaDiv.appendChild(sep);
        }
        const span = document.createElement("span");
        span.textContent = m;
        metaDiv.appendChild(span);
      });
      tdName.appendChild(metaDiv);
    }
    if (!available) {
      const badge = document.createElement("span");
      badge.className = "badge badge-na";
      badge.textContent = "Non disponibile";
      tdName.appendChild(document.createElement("br"));
      tdName.appendChild(badge);
    }

    /* Foto */
    const tdFoto = document.createElement("td");
    tdFoto.className = "col-foto";
    if (p.image_url) {
      const img = document.createElement("img");
      img.src = p.image_url;
      img.alt = p.name || "";
      img.loading = "lazy";
      tdFoto.appendChild(img);
    } else {
      tdFoto.textContent = "—";
    }

    /* Costo (placeholder) */
    const tdCosto = document.createElement("td");
    tdCosto.className = "col-costo";
    tdCosto.textContent = "—";

    /* Prezzo */
    const tdPrezzo = document.createElement("td");
    tdPrezzo.className = "col-prezzo";
    tdPrezzo.textContent = formatEUR(p.price);

    /* Actions (admin only) */
    const tdAct = document.createElement("td");
    tdAct.className = "col-actions";
    if (currentUser) {
      const wrap = document.createElement("div");
      wrap.className = "row-actions";

      const editBtn = document.createElement("button");
      editBtn.className = "icon-btn edit";
      editBtn.type = "button";
      editBtn.textContent = "Modifica";
      editBtn.addEventListener("click", () => enterEditMode(p));
      wrap.appendChild(editBtn);

      const delBtn = document.createElement("button");
      delBtn.className = "icon-btn del";
      delBtn.type = "button";
      delBtn.textContent = "Elimina";
      delBtn.addEventListener("click", () => deleteProduct(p));
      wrap.appendChild(delBtn);

      tdAct.appendChild(wrap);
    }

    tr.append(tdName, tdFoto, tdCosto, tdPrezzo, tdAct);
    tbody.appendChild(tr);
  });
}

/* ===========================================================
   SEARCH + FILTER WIRING
   =========================================================== */
document.getElementById("searchInput").addEventListener("input", e => {
  searchQuery = e.target.value;
  render();
});
document.querySelectorAll(".chip").forEach(chip => {
  chip.addEventListener("click", () => {
    document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
    chip.classList.add("active");
    activeCategory = chip.dataset.cat;
    render();
  });
});

/* ===========================================================
   ADD / EDIT / DELETE
   =========================================================== */
const nameInput     = document.getElementById("pName");
const categoryInput = document.getElementById("pCategory");
const colorInput    = document.getElementById("pColor");
const priceInput    = document.getElementById("pPrice");
const photoInput    = document.getElementById("pPhoto");
const availInput    = document.getElementById("pAvailable");
const preview       = document.getElementById("preview");
const addBtn        = document.getElementById("addBtn");
const cancelEditBtn = document.getElementById("cancelEditBtn");
const editorTitle   = document.getElementById("editorTitle");
const editBanner    = document.getElementById("editBanner");
const printBtn      = document.getElementById("printBtn");
const printBtnPub   = document.getElementById("printBtnPublic");

photoInput.addEventListener("change", () => {
  preview.innerHTML = "";
  pendingImageFile = null;

  const file = photoInput.files && photoInput.files[0];
  if (!file) {
    if (editingId) showCurrentImageHint();
    return;
  }
  pendingImageFile = file;

  const reader = new FileReader();
  reader.onload = e => {
    const img = document.createElement("img");
    img.src = e.target.result;
    img.alt = "Anteprima";
    preview.appendChild(img);
  };
  reader.readAsDataURL(file);
});

function showCurrentImageHint() {
  if (!editingId) return;
  const p = products.find(x => x.id === editingId);
  preview.innerHTML = "";
  if (p && p.image_url) {
    const img = document.createElement("img");
    img.src = p.image_url;
    img.alt = "Immagine attuale";
    preview.appendChild(img);
  }
  const hint = document.createElement("span");
  hint.className = "hint";
  hint.textContent = "Lascia vuoto per mantenere l'immagine attuale.";
  preview.appendChild(hint);
}

function enterEditMode(p) {
  editingId = p.id;
  editorTitle.textContent = "Modifica prodotto";
  addBtn.textContent = "Salva modifiche";
  cancelEditBtn.style.display = "inline-block";
  editBanner.classList.add("show");

  nameInput.value     = p.name || "";
  categoryInput.value = CATEGORIES.includes(getCategory(p)) ? getCategory(p) : DEFAULT_CATEGORY;
  colorInput.value    = getColor(p);
  priceInput.value    = (p.price !== null && p.price !== undefined) ? p.price : "";
  availInput.checked  = isAvailable(p);
  photoInput.value    = "";
  pendingImageFile    = null;
  showCurrentImageHint();

  /* Scroll editor into view */
  editorPanel.scrollIntoView({ behavior: "smooth", block: "start" });
}

function exitEditMode() {
  editingId = null;
  editorTitle.textContent = "Aggiungi prodotto";
  addBtn.textContent = "Aggiungi";
  cancelEditBtn.style.display = "none";
  editBanner.classList.remove("show");
  resetForm();
}

function resetForm() {
  nameInput.value     = "";
  categoryInput.value = DEFAULT_CATEGORY;
  colorInput.value    = "";
  priceInput.value    = "";
  availInput.checked  = true;
  photoInput.value    = "";
  preview.innerHTML   = "";
  pendingImageFile    = null;
}

cancelEditBtn.addEventListener("click", () => {
  exitEditMode();
  clearStatus();
});

addBtn.addEventListener("click", async () => {
  if (!currentUser) {
    showStatus("Devi accedere per aggiungere prodotti.", "error");
    return;
  }
  const name     = nameInput.value.trim();
  const category = categoryInput.value;
  const color    = colorInput.value.trim();
  const price    = parseFloat(priceInput.value);
  const available = !!availInput.checked;

  if (!name) {
    showStatus("Inserisci il nome del prodotto.", "error");
    nameInput.focus();
    return;
  }
  if (isNaN(price) || price < 0) {
    showStatus("Inserisci un prezzo valido.", "error");
    priceInput.focus();
    return;
  }

  addBtn.disabled = true;
  cancelEditBtn.disabled = true;
  showStatus(editingId ? "Salvataggio modifiche…" : "Salvataggio in corso…", "info");

  /* === Manage image upload (optional in edit mode) === */
  let newImageUrl  = null;
  let newImagePath = null;
  let oldImagePath = null;

  if (editingId) {
    const old = products.find(x => x.id === editingId);
    if (old) oldImagePath = old.image_path || null;
  }

  if (pendingImageFile) {
    const ext = (pendingImageFile.name.split(".").pop() || "jpg").toLowerCase();
    const safeName = Date.now() + "-" + Math.random().toString(36).slice(2, 8) + "." + ext;
    newImagePath = safeName;

    const { error: upErr } = await sb.storage
      .from(BUCKET_NAME)
      .upload(newImagePath, pendingImageFile, {
        cacheControl: "3600",
        upsert: false,
        contentType: pendingImageFile.type
      });

    if (upErr) {
      addBtn.disabled = false;
      cancelEditBtn.disabled = false;
      showStatus("Errore upload immagine: " + upErr.message, "error");
      return;
    }
    const { data: pub } = sb.storage.from(BUCKET_NAME).getPublicUrl(newImagePath);
    newImageUrl = pub.publicUrl;
  }

  /* === Build payload === */
  const payload = { name, category, color, price, available };

  if (editingId) {
    /* Update existing */
    if (newImageUrl) {
      payload.image_url  = newImageUrl;
      payload.image_path = newImagePath;
    }
    const { error: updErr } = await sb
      .from("products")
      .update(payload)
      .eq("id", editingId);

    if (updErr) {
      addBtn.disabled = false;
      cancelEditBtn.disabled = false;
      showStatus("Errore salvataggio: " + updErr.message, "error");
      return;
    }

    /* If image was replaced, remove the old one */
    if (newImagePath && oldImagePath) {
      const { error: rmErr } = await sb.storage.from(BUCKET_NAME).remove([oldImagePath]);
      if (rmErr) console.warn("Storage remove warning:", rmErr.message);
    }

    addBtn.disabled = false;
    cancelEditBtn.disabled = false;
    showStatus("Prodotto aggiornato.", "ok");
    exitEditMode();
    await loadProducts();
  } else {
    /* Insert new */
    payload.image_url  = newImageUrl;
    payload.image_path = newImagePath;

    const { error: insErr } = await sb
      .from("products")
      .insert([payload]);

    addBtn.disabled = false;
    cancelEditBtn.disabled = false;

    if (insErr) {
      showStatus("Errore salvataggio prodotto: " + insErr.message, "error");
      return;
    }
    resetForm();
    showStatus("Prodotto aggiunto.", "ok");
    await loadProducts();
    nameInput.focus();
  }
});

async function deleteProduct(p) {
  if (!currentUser) return;
  if (!confirm("Eliminare \"" + (p.name || "questo prodotto") + "\"?\nL'operazione non è reversibile.")) return;

  showStatus("Eliminazione in corso…", "info");

  if (p.image_path) {
    const { error: rmErr } = await sb.storage.from(BUCKET_NAME).remove([p.image_path]);
    if (rmErr) console.warn("Storage remove warning:", rmErr.message);
  }

  const { error } = await sb.from("products").delete().eq("id", p.id);
  if (error) {
    showStatus("Errore eliminazione: " + error.message, "error");
    return;
  }
  if (editingId === p.id) exitEditMode();
  showStatus("Prodotto eliminato.", "ok");
  await loadProducts();
}

/* Print buttons */
printBtn.addEventListener("click", () => window.print());
printBtnPub.addEventListener("click", () => window.print());

/* ===========================================================
   INIT
   =========================================================== */
(async function init() {
  const { data: { session } } = await sb.auth.getSession();
  currentUser = session ? session.user : null;
  updateAuthUI();
  await loadProducts();
})();
</script>
