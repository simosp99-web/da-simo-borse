<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>DA SIMO — Listino</title>
<style>
  /* =========================================================
     BASE / RESET
     ========================================================= */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Didot", "Bodoni 72", "Bodoni MT", "Playfair Display", Georgia, "Times New Roman", serif;
    color: #1a1a1a;
    background: #ece8e2;
    -webkit-text-size-adjust: 100%;
    line-height: 1.5;
  }
  button, input { font-family: inherit; }

  /* =========================================================
     PAGE WRAPPER
     ========================================================= */
  .page {
    max-width: 820px;
    margin: 24px auto;
    background: #fdfcfa;
    padding: 40px 48px 32px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.10);
    border-radius: 4px;
  }

  /* =========================================================
     HEADER — elegant serif with decorative ornament
     ========================================================= */
  .header {
    text-align: center;
    margin-bottom: 28px;
  }
  .header h1 {
    margin: 0;
    font-size: 46px;
    letter-spacing: 8px;
    font-weight: 400;
  }
  .header .subtitle {
    margin-top: 4px;
    font-size: 16px;
    font-style: italic;
    letter-spacing: 1px;
    color: #2a2a2a;
    font-weight: 400;
  }
  .ornament {
    margin: 14px auto 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: #2a2a2a;
  }
  .ornament .line {
    flex: 0 1 180px;
    height: 1px;
    background: #2a2a2a;
  }
  .ornament .glyph {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 18px;
    letter-spacing: 4px;
    line-height: 1;
    transform: translateY(-1px);
  }

  /* =========================================================
     EDITOR
     ========================================================= */
  .editor {
    background: #f6f1ea;
    border: 1px solid #d9cfbf;
    border-radius: 8px;
    padding: 18px 18px 16px;
    margin-bottom: 32px;
  }
  .editor h2 {
    margin: 0 0 14px 0;
    font-size: 17px;
    color: #2a2a2a;
    letter-spacing: 3px;
    font-weight: 400;
    text-transform: uppercase;
    text-align: center;
  }
  .field { display: flex; flex-direction: column; margin-bottom: 14px; }
  .field label {
    font-size: 14px;
    color: #333;
    margin-bottom: 6px;
    letter-spacing: 0.5px;
  }
  .field input[type="text"],
  .field input[type="number"] {
    width: 100%;
    padding: 14px 12px;
    font-size: 16px;
    border: 1px solid #c7bca8;
    border-radius: 6px;
    background: #fff;
    font-family: Georgia, "Times New Roman", serif;
  }
  .field input[type="file"] { font-size: 15px; padding: 10px 0; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
  .btn {
    flex: 1 1 140px;
    padding: 14px 16px;
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 400;
    border-radius: 6px;
    border: 1px solid #1a1a1a;
    background: #1a1a1a;
    color: #fdfcfa;
    cursor: pointer;
    min-height: 48px;
    font-family: inherit;
  }
  .btn.secondary { background: transparent; color: #1a1a1a; }
  .btn:active { transform: translateY(1px); }

  .preview { margin-top: 8px; font-size: 13px; color: #666; }
  .preview img {
    margin-top: 6px;
    max-height: 80px;
    max-width: 100%;
    object-fit: contain;
    border: 1px solid #d9cfbf;
    border-radius: 4px;
    background: #fff;
  }

  /* =========================================================
     CATALOG TABLE — elegant style
     ========================================================= */
  .catalog { width: 100%; }
  table.catalog-table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }
  table.catalog-table thead th {
    text-align: left;
    font-size: 15px;
    color: #1a1a1a;
    border-bottom: 1px solid #1a1a1a;
    padding: 10px 8px 12px;
    font-weight: 400;
    letter-spacing: 0.5px;
  }
  table.catalog-table th.col-foto,
  table.catalog-table td.col-foto   { text-align: center; width: 130px; }
  table.catalog-table th.col-costo,
  table.catalog-table td.col-costo  { text-align: center; width: 90px; color: #555; }
  table.catalog-table th.col-prezzo,
  table.catalog-table td.col-prezzo { text-align: right; width: 130px; }
  table.catalog-table th.col-actions,
  table.catalog-table td.col-actions { width: 50px; text-align: center; }

  table.catalog-table tbody td {
    padding: 18px 8px;
    border-bottom: 1px solid #c4bbac;
    vertical-align: middle;
    font-size: 16px;
  }
  table.catalog-table tbody td.col-descr { word-break: break-word; line-height: 1.35; }
  table.catalog-table tbody td.col-prezzo { white-space: nowrap; }
  table.catalog-table tbody td.col-foto img {
    max-height: 90px;
    max-width: 110px;
    object-fit: contain;
    display: inline-block;
  }
  .del-btn {
    background: transparent;
    border: 1px solid #b54040;
    color: #b54040;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    padding: 0;
    font-family: Georgia, serif;
  }
  .del-btn:active { background: #fbecec; }

  .empty-msg {
    text-align: center;
    color: #888;
    padding: 28px 8px;
    font-style: italic;
    font-size: 15px;
  }

  /* =========================================================
     FOOTER (only in print)
     ========================================================= */
  .footer {
    display: none;
    text-align: center;
    margin-top: 28px;
    font-size: 13px;
    color: #1a1a1a;
    font-style: italic;
  }

  /* =========================================================
     RESPONSIVE — iPhone (card-row)
     ========================================================= */
  @media (max-width: 600px) {
    .page { margin: 0; padding: 24px 18px; box-shadow: none; border-radius: 0; }
    .header h1 { font-size: 34px; letter-spacing: 6px; }
    .header .subtitle { font-size: 14px; }
    .ornament .line { flex-basis: 90px; }

    table.catalog-table thead { display: none; }
    table.catalog-table,
    table.catalog-table tbody,
    table.catalog-table tr,
    table.catalog-table td { display: block; width: 100%; }

    table.catalog-table tr {
      display: grid;
      grid-template-columns: 1fr 110px;
      grid-template-areas:
        "descr  foto"
        "prezzo foto"
        "costo  foto"
        "act    act";
      gap: 4px 14px;
      padding: 16px 0;
      border-bottom: 1px solid #c4bbac;
      align-items: center;
    }
    table.catalog-table td { border: none; padding: 0; }
    table.catalog-table td.col-descr   { grid-area: descr;  font-size: 17px; }
    table.catalog-table td.col-foto    { grid-area: foto;   text-align: center; }
    table.catalog-table td.col-costo   { grid-area: costo;  font-size: 13px; color: #777; text-align: left; font-style: italic; }
    table.catalog-table td.col-costo::before  { content: "Costo: "; }
    table.catalog-table td.col-prezzo  { grid-area: prezzo; text-align: left; font-size: 16px; }
    table.catalog-table td.col-prezzo::before { content: "Prezzo: "; font-style: italic; color: #777; font-size: 13px; }
    table.catalog-table td.col-actions { grid-area: act; text-align: right; padding-top: 4px; }
    table.catalog-table td.col-foto img { max-height: 95px; max-width: 105px; }
  }

  /* =========================================================
     PRINT — A4
     ========================================================= */
  @media print {
    @page { size: A4; margin: 14mm 16mm; }
    body { background: #fff; }
    .page {
      box-shadow: none;
      margin: 0;
      padding: 0;
      max-width: 100%;
      background: #fff;
      border-radius: 0;
    }
    .editor { display: none !important; }
    .footer { display: block; }

    table.catalog-table,
    table.catalog-table thead,
    table.catalog-table tbody,
    table.catalog-table tr,
    table.catalog-table th,
    table.catalog-table td { display: revert; }
    table.catalog-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    table.catalog-table thead { display: table-header-group; }
    table.catalog-table tbody { display: table-row-group; }
    table.catalog-table tr    { display: table-row; }
    table.catalog-table th,
    table.catalog-table td    { display: table-cell; }

    .col-actions { display: none !important; }
    table.catalog-table td.col-costo::before,
    table.catalog-table td.col-prezzo::before { content: none; }

    table.catalog-table thead th {
      border-bottom: 1px solid #000;
      color: #000;
      padding: 8px;
      font-size: 11pt;
      font-weight: 400;
    }
    table.catalog-table th.col-foto,
    table.catalog-table td.col-foto   { text-align: center; width: 28%; }
    table.catalog-table th.col-costo,
    table.catalog-table td.col-costo  { text-align: center; width: 16%; color: #333; }
    table.catalog-table th.col-prezzo,
    table.catalog-table td.col-prezzo { text-align: right; width: 22%; }

    table.catalog-table tbody td {
      border-bottom: 1px solid #888;
      padding: 14px 8px;
      font-size: 11pt;
      vertical-align: middle;
    }
    table.catalog-table tbody td.col-foto img {
      max-height: 85px;
      max-width: 100%;
      object-fit: contain;
    }

    .header h1 { font-size: 32pt; letter-spacing: 8px; }
    .header .subtitle { font-size: 12pt; font-style: italic; }
    .ornament .line { background: #000; }

    tr, td { page-break-inside: avoid; }
  }
</style>
</head>
<body>

<div class="page">

  <!-- HEADER -->
  <header class="header">
    <h1 id="shopTitle">DA SIMO</h1>
    <div class="subtitle" id="shopSubtitle">borse e accessori in pelle</div>
    <div class="ornament" aria-hidden="true">
      <span class="line"></span>
      <span class="glyph">&#10086;</span>
      <span class="line"></span>
    </div>
  </header>

  <!-- EDITOR -->
  <section class="editor" aria-label="Aggiungi prodotto">
    <h2>Aggiungi prodotto</h2>

    <div class="field">
      <label for="pName">Nome prodotto</label>
      <input type="text" id="pName" placeholder="Es. Borsa a tracolla in pelle" autocomplete="off" />
    </div>

    <div class="field">
      <label for="pPrice">Prezzo di vendita (EUR)</label>
      <input type="number" id="pPrice" inputmode="decimal" step="0.01" min="0" placeholder="Es. 89,00" />
    </div>

    <div class="field">
      <label for="pPhoto">Foto prodotto</label>
      <input type="file" id="pPhoto" accept="image/*" capture="environment" />
      <div class="preview" id="preview"></div>
    </div>

    <div class="actions">
      <button class="btn" id="addBtn" type="button">Aggiungi</button>
      <button class="btn secondary" id="printBtn" type="button">Stampa</button>
    </div>
  </section>

  <!-- CATALOG -->
  <section class="catalog">
    <table class="catalog-table" id="catalogTable">
      <thead>
        <tr>
          <th class="col-descr">Descrizione</th>
          <th class="col-foto">FOTO</th>
          <th class="col-costo">Costo</th>
          <th class="col-prezzo">Prezzo vendita</th>
          <th class="col-actions" aria-label="Azioni"></th>
        </tr>
      </thead>
      <tbody id="catalogBody"></tbody>
    </table>
    <div class="empty-msg" id="emptyMsg">Nessun prodotto ancora aggiunto.</div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    Pagina 1 di 1
  </footer>

</div>

<script>
/* ===========================================================
   EDITABLE CONSTANTS
   =========================================================== */
const SHOP_TITLE    = "DA SIMO";
const SHOP_SUBTITLE = "borse e accessori in pelle";
const STORAGE_KEY   = "dasimo.catalog.v1";

document.getElementById("shopTitle").textContent    = SHOP_TITLE;
document.getElementById("shopSubtitle").textContent = SHOP_SUBTITLE;
document.title = SHOP_TITLE + " — Listino";

/* ===========================================================
   STATE
   =========================================================== */
let products = [];

/* ===========================================================
   UTILITIES
   =========================================================== */
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function formatEUR(n) {
  if (typeof n !== "number" || isNaN(n)) return "—";
  return n.toFixed(2).replace(".", ",") + " €";
}

function fileToDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload  = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}

/* ===========================================================
   PERSISTENCE
   =========================================================== */
function saveProducts() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
  } catch (e) {
    console.warn("Impossibile salvare in localStorage:", e);
    alert("Spazio di archiviazione pieno: prova a rimuovere qualche prodotto o usare immagini più piccole.");
  }
}
function loadProducts() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return [];
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : [];
  } catch (e) {
    console.warn("Errore lettura localStorage:", e);
    return [];
  }
}

/* ===========================================================
   RENDER
   =========================================================== */
const tbody    = document.getElementById("catalogBody");
const emptyMsg = document.getElementById("emptyMsg");

function render() {
  tbody.innerHTML = "";

  if (products.length === 0) {
    emptyMsg.style.display = "block";
    return;
  }
  emptyMsg.style.display = "none";

  products.forEach(p => {
    const tr = document.createElement("tr");
    tr.dataset.id = p.id;

    const tdName = document.createElement("td");
    tdName.className = "col-descr";
    tdName.textContent = p.name;

    const tdFoto = document.createElement("td");
    tdFoto.className = "col-foto";
    if (p.image) {
      const img = document.createElement("img");
      img.src = p.image;
      img.alt = p.name;
      tdFoto.appendChild(img);
    } else {
      tdFoto.textContent = "—";
    }

    const tdCosto = document.createElement("td");
    tdCosto.className = "col-costo";
    tdCosto.textContent = "—";

    const tdPrezzo = document.createElement("td");
    tdPrezzo.className = "col-prezzo";
    tdPrezzo.textContent = formatEUR(p.price);

    const tdAct = document.createElement("td");
    tdAct.className = "col-actions";
    const delBtn = document.createElement("button");
    delBtn.className = "del-btn";
    delBtn.type = "button";
    delBtn.title = "Elimina";
    delBtn.setAttribute("aria-label", "Elimina prodotto");
    delBtn.textContent = "×";
    delBtn.addEventListener("click", () => deleteProduct(p.id));
    tdAct.appendChild(delBtn);

    tr.append(tdName, tdFoto, tdCosto, tdPrezzo, tdAct);
    tbody.appendChild(tr);
  });
}

/* ===========================================================
   ACTIONS
   =========================================================== */
const nameInput  = document.getElementById("pName");
const priceInput = document.getElementById("pPrice");
const photoInput = document.getElementById("pPhoto");
const preview    = document.getElementById("preview");
const addBtn     = document.getElementById("addBtn");
const printBtn   = document.getElementById("printBtn");

let pendingImageDataURL = null;

photoInput.addEventListener("change", async () => {
  preview.innerHTML = "";
  pendingImageDataURL = null;

  const file = photoInput.files && photoInput.files[0];
  if (!file) return;

  try {
    const dataURL = await fileToDataURL(file);
    pendingImageDataURL = dataURL;

    const img = document.createElement("img");
    img.src = dataURL;
    img.alt = "Anteprima";
    preview.appendChild(img);
  } catch (e) {
    console.warn("Errore lettura immagine:", e);
    preview.textContent = "Impossibile leggere l'immagine.";
  }
});

addBtn.addEventListener("click", () => {
  const name  = nameInput.value.trim();
  const price = parseFloat(priceInput.value);

  if (!name) {
    alert("Inserisci il nome del prodotto.");
    nameInput.focus();
    return;
  }
  if (isNaN(price) || price < 0) {
    alert("Inserisci un prezzo valido.");
    priceInput.focus();
    return;
  }

  products.push({
    id:    uid(),
    name:  name,
    price: price,
    image: pendingImageDataURL
  });
  saveProducts();
  render();

  nameInput.value  = "";
  priceInput.value = "";
  photoInput.value = "";
  preview.innerHTML = "";
  pendingImageDataURL = null;
  nameInput.focus();
});

function deleteProduct(id) {
  const p = products.find(x => x.id === id);
  const label = p ? p.name : "questo prodotto";
  if (!confirm("Eliminare \"" + label + "\"?")) return;

  products = products.filter(x => x.id !== id);
  saveProducts();
  render();
}

printBtn.addEventListener("click", () => window.print());

/* ===========================================================
   INIT
   =========================================================== */
products = loadProducts();
render();
</script>

</body>
</html>
